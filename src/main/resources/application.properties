spring.application.name=jwt-nimbus-qycandle
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/jwt_qycandle?serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

security.jwt.secret-key=${JWT_SECRET:}
security.jwt.expiration-time=${JWT_EXPIRATION:3600000}

spring.web.resources.cache.period=0
server.error.include-message=never
