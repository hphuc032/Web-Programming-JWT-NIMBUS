<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập - QY Candle</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body><nav class="navbar fixed-top navbar-qy"><div class="container py-2"><a class="navbar-brand brand" href="/">QY CANDLE</a><a class="nav-link" href="/">Trang chủ</a></div></nav>
<main class="auth-page"><section class="auth-card"><div class="eyebrow mb-2">Chào mừng trở lại</div><h1 class="h2 mb-2">Đăng nhập</h1><p class="text-secondary mb-4">Tiếp tục hành trình hương thơm dịu dàng của bạn.</p>
<form onsubmit="login(event)"><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-qy w-100" type="submit">Đăng nhập</button></form><div id="message" class="message mt-3"></div><p class="text-center mt-4 mb-0">Chưa có tài khoản? <a href="/register" class="link-secondary">Tạo tài khoản</a></p>
</section></main><script src="/js/mainjs.js"></script></body></html>
