<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tạo tài khoản - QY Candle</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body><nav class="navbar fixed-top navbar-qy"><div class="container py-2"><a class="navbar-brand brand" href="/">QY CANDLE</a><a class="nav-link" href="/login">Đăng nhập</a></div></nav>
<main class="auth-page"><section class="auth-card"><div class="eyebrow mb-2">Thành viên QY Candle</div><h1 class="h2 mb-2">Tạo tài khoản</h1><p class="text-secondary mb-4">Lưu lại những khoảnh khắc thơm lành cùng chúng tôi.</p>
<form onsubmit="register(event)"><div class="mb-3"><label class="form-label" for="fullName">Họ và tên</label><input class="form-control" id="fullName" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><div class="form-text">Tối thiểu 8 ký tự.</div></div><button class="btn btn-qy w-100" type="submit">Tạo tài khoản</button></form><div id="message" class="message mt-3"></div><p class="text-center mt-4 mb-0">Đã có tài khoản? <a href="/login" class="link-secondary">Đăng nhập</a></p>
</section></main><script src="/js/mainjs.js"></script></body></html>
